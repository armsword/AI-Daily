<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #e0e0e0;
    width: {{ card_width }}px;
    padding: 40px;
}
.header {
    text-align: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid #333;
}
.header h1 {
    font-size: 28px;
    color: #64ffda;
    margin-bottom: 8px;
}
.header .date {
    font-size: 16px;
    color: #888;
}
.summary {
    background: rgba(100, 255, 218, 0.05);
    border-left: 3px solid #64ffda;
    padding: 16px 20px;
    margin-bottom: 30px;
    font-size: 15px;
    line-height: 1.6;
    color: #ccc;
}
.category-section {
    margin-bottom: 24px;
}
.category-title {
    font-size: 16px;
    color: #64ffda;
    margin-bottom: 12px;
    padding: 4px 12px;
    background: rgba(100, 255, 218, 0.1);
    border-radius: 4px;
    display: inline-block;
}
.news-item {
    padding: 12px 0;
    border-bottom: 1px solid #2a2a3e;
}
.news-item:last-child { border-bottom: none; }
.news-item .title {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
}
.news-item .desc {
    font-size: 13px;
    color: #999;
}
.news-item .source {
    font-size: 12px;
    color: #64ffda;
    margin-top: 4px;
}
.footer {
    text-align: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid #333;
    font-size: 12px;
    color: #666;
}
</style>
</head>
<body>
<div class="header">
    <h1>AI Daily</h1>
    <div class="date">{{ date }}</div>
</div>
<div class="summary">{{ trend_summary }}</div>
{% for category, items in grouped_news.items() %}
<div class="category-section">
    <div class="category-title">{{ category }}</div>
    {% for item in items %}
    <div class="news-item">
        <div class="title">{{ item.title }}</div>
        <div class="desc">{{ item.summary }}</div>
        <div class="source">via {{ item.source }}</div>
    </div>
    {% endfor %}
</div>
{% endfor %}
<div class="footer">Generated by AI Daily Service</div>
</body>
</html>
