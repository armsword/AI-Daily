schedule:
  cron: "30 10 * * *"

llm:
  model: "anthropic/auto"
  api_key_env: "ANTHROPIC_API_KEY"

crawler:
  sources:
    - hackernews
    - reddit
  reddit_subreddits:
    - artificial
    - MachineLearning
    - LocalLLaMA
  keywords:
    - AI
    - LLM
    - GPT
    - Claude
    - machine learning
    - deep learning
  max_items_per_source: 50

minimax:
  api_key_env: "MINIMAX_API_KEY"
  api_base: "https://api.minimaxi.com"

output:
  dir: "output"
  card_width: 800
  top_n: 12
