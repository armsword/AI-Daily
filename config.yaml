schedule:
  cron: "30 10 * * *"

llm:
  model: "anthropic/auto"
  api_key_env: "ANTHROPIC_API_KEY"

crawler:
  sources:
    - hackernews
    - reddit
    - techcrunch
    - producthunt
    - github
  reddit_subreddits:
    - artificial
    - MachineLearning
    - LocalLLaMA
  keywords:
    - AI
    - LLM
    - GPT
    - Claude
    - machine learning
    - deep learning
    - neural network
    - transformer
    - diffusion
    - Gemini
    - OpenAI
    - Anthropic
    - Mistral
    - Llama
    - stable diffusion
    - AGI
    - RAG
    - fine-tuning
    - embedding
    - multimodal
  max_items_per_source: 100

minimax:
  api_key_env: "MINIMAX_API_KEY"
  api_base: "https://api.minimaxi.com"

output:
  dir: "output"
  card_width: 800
  top_n: 12
